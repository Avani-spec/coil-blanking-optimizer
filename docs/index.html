  <title>Circle blanking layout</title>

<body>
  <div id="root"></div>
  <script type="module">
    import { mount } from "https://cdn.jsdelivr.net/npm/@stlite/browser@1.9.2/build/stlite.js";
    mount({
      requirements: ["matplotlib", "pandas", "numpy"],
      entrypoint: "app.py",
      files: {"app.py": "\"\"\"Operator dashboard.  streamlit run app.py\"\"\"\nimport sys\nfrom pathlib import Path\n\nimport pandas as pd\nimport streamlit as st\n\nsys.path.insert(0, str(Path(__file__).parent / \"src\"))\nfrom blanking.geometry import layout  # noqa: E402\nfrom blanking.optimizer import Constraints, Order, enumerate_configs, optimise  # noqa: E402\nfrom blanking.plot import draw_layout  # noqa: E402\n\nst.set_page_config(page_title=\"Circle blanking layout\", layout=\"wide\")\nst.title(\"Circle blanking layout\")\n\nwith st.sidebar:\n    st.header(\"Order\")\n    d = st.number_input(\"Blank diameter (mm)\", 20.0, 1500.0, 260.0, 1.0)\n    t = st.number_input(\"Thickness (mm)\", 0.2, 10.0, 1.0, 0.1)\n    qty = st.number_input(\"Blanks required\", 0, 10_000_000, 50_000, 1000)\n    st.header(\"Tooling\")\n    bridge = st.number_input(\"Bridge between blanks (mm)\", 0.0, 50.0, 3.0, 0.5)\n    edge = st.number_input(\"Edge trim per side (mm)\", 0.0, 50.0, 5.0, 0.5)\n    max_lanes = st.slider(\"Max lanes on die\", 1, 10, 6)\n    amin, amax = st.slider(\"Allowed blanking angle (\u00b0)\", 30.0, 90.0, (30.0, 90.0), 0.5)\n    st.header(\"Line and stock\")\n    widths_txt = st.text_input(\"Coil widths in stock (mm, comma separated)\", \"1000, 1100, 1250, 1350, 1500\")\n    wmin, wmax = st.slider(\"Line strip width limits (mm)\", 100, 2500, (600, 1600), 10)\n    coil_kg = st.number_input(\"Coil mass (kg)\", 100.0, 30000.0, 3000.0, 100.0)\n    head_tail = st.number_input(\"Head + tail scrap per coil (mm)\", 0.0, 20000.0, 1500.0, 100.0)\n\ntry:\n    widths = sorted({float(w) for w in widths_txt.replace(\";\", \",\").split(\",\") if w.strip()})\nexcept ValueError:\n    st.error(\"Coil widths must be numbers separated by commas, e.g. 1000, 1250, 1500.\")\n    st.stop()\n\norder = Order(d, t, int(qty), bridge, edge)\ncons = Constraints(widths, wmin, wmax, max_lanes, amin, amax, 0.5, None, head_tail, coil_kg)\nbest = optimise(order, cons, top=10)\nn_eval = len(enumerate_configs(order, cons))\n\nif best.empty:\n    st.error(\"No configuration fits. Check that at least one coil width is inside the line limits \"\n             \"and wider than the blank plus both edge trims.\")\n    st.stop()\n\nst.caption(f\"Evaluated {n_eval:,} coil width \u00d7 lane \u00d7 angle combinations.\")\ntop = best.iloc[0]\nc1, c2, c3, c4 = st.columns(4)\nc1.metric(\"Best recovery\", f\"{top.recovery:.1%}\")\nc2.metric(\"Coil width\", f\"{top.coil_width:g} mm\")\nc3.metric(\"Lanes / angle\", f\"{int(top.lanes)} @ {top.angle:g}\u00b0\")\nif qty:\n    c4.metric(\"Coils for order\", f\"{int(top.coils_needed)}\")\n\nleft, right = st.columns([3, 2])\nwith left:\n    st.subheader(\"Ranked configurations\")\n    show = best.copy()\n    show[\"recovery\"] = (show.recovery * 100).round(2)\n    cols = [\"coil_width\", \"lanes\", \"angle\", \"pitch\", \"width_used\", \"side_scrap\", \"recovery\", \"blanks_per_m\"]\n    if qty:\n        cols += [\"blanks_per_coil\", \"coils_needed\", \"scrap_kg\"]\n    st.dataframe(show[cols].rename(columns={\"recovery\": \"recovery %\"}).round(1), hide_index=True,\n                 width=\"stretch\")\n    pick = st.selectbox(\"Preview configuration\", show.index,\n                        format_func=lambda i: f\"#{i + 1}: {show.at[i, 'coil_width']:g} mm, \"\n                                              f\"{int(show.at[i, 'lanes'])} lanes @ {show.at[i, 'angle']:g}\u00b0\")\n    r = best.loc[pick]\n    L = layout(d, bridge, edge, int(r.lanes), r.angle, r.coil_width)\n    st.pyplot(draw_layout(L).figure)\n\nwith right:\n    st.subheader(\"Check a current setting\")\n    cw = st.selectbox(\"Coil width\", widths, index=len(widths) - 1)\n    lanes = st.number_input(\"Lanes\", 1, 10, 3)\n    ang = st.number_input(\"Angle (\u00b0)\", 30.0, 90.0, 60.0, 0.5)\n    cur = layout(d, bridge, edge, lanes, ang, cw)\n    if not cur.feasible:\n        st.error(f\"Does not fit: needs {cur.width_used:.1f} mm of strip, coil is {cw:g} mm.\")\n    else:\n        st.write(f\"Recovery **{cur.recovery:.1%}**, pitch {cur.pitch:.1f} mm, side scrap {cur.side_scrap:.1f} mm.\")\n        gain = (top.recovery - cur.recovery) * 100\n        if gain > 0.05:\n            st.success(f\"The top configuration recovers {gain:.1f} percentage points more material.\")\n        else:\n            st.info(\"This setting is already as good as the best configuration found.\")\n    st.subheader(\"Recovery vs angle\")\n    all_cfg = enumerate_configs(order, cons)\n    sub = all_cfg[all_cfg.feasible & (all_cfg.coil_width == cw) & (all_cfg.lanes > 1)]\n    if not sub.empty:\n        chart = sub.pivot_table(index=\"angle\", columns=\"lanes\", values=\"recovery\").mul(100)\n        chart.columns = [f\"{c} lanes\" for c in chart.columns]\n        st.line_chart(chart)\n", "src/blanking/__init__.py": "\"\"\"Layout optimisation for blanking circles from aluminium coil.\"\"\"\nfrom .geometry import Layout, layout\nfrom .optimizer import Constraints, optimise\n\n__all__ = [\"Layout\", \"layout\", \"Constraints\", \"optimise\"]\n", "src/blanking/analysis.py": "\"\"\"Analysis of historical blanking batches.\n\nExpected columns: batch_id, date, diameter, thickness, coil_width, lanes,\nangle, bridge, edge, input_kg, output_kg (good blanks).\n\n* ``recovery`` = output_kg / input_kg for each batch\n* baseline recovery by diameter\n* high-loss batches: process loss (theoretical recovery of the layout used\n  minus actual recovery) with a robust z-score (median / MAD) above ``z``\n  (default 3). Using process loss rather than raw recovery separates bad\n  batches from batches that simply used a less efficient layout.\n* opportunity: theoretical recovery of the configuration used vs. the best\n  feasible configuration found by the optimiser\n\"\"\"\nfrom __future__ import annotations\n\nimport numpy as np\nimport pandas as pd\n\nfrom .geometry import layout\nfrom .optimizer import Constraints, Order, optimise\n\n\ndef add_recovery(df: pd.DataFrame) -> pd.DataFrame:\n    df = df.copy()\n    df[\"recovery\"] = df.output_kg / df.input_kg\n    df[\"theoretical\"] = [layout(r.diameter, r.bridge, r.edge, r.lanes, r.angle, r.coil_width).recovery\n                         for r in df.itertuples()]\n    # process losses = what the geometry allowed minus what was actually achieved\n    df[\"process_loss\"] = df.theoretical - df.recovery\n    return df\n\n\ndef flag_high_loss(df: pd.DataFrame, z: float = 3.0) -> pd.DataFrame:\n    df = df.copy()\n    x = df.process_loss\n    mad = (x - x.median()).abs().median() * 1.4826 + 1e-9\n    df[\"robust_z\"] = (x - x.median()) / mad\n    df[\"high_loss\"] = df.robust_z > z\n    return df\n\n\ndef baseline(df: pd.DataFrame) -> pd.DataFrame:\n    return df.groupby(\"diameter\").agg(batches=(\"batch_id\", \"count\"), input_t=(\"input_kg\", lambda x: x.sum() / 1000),\n                                      recovery_mean=(\"recovery\", \"mean\"), recovery_p10=(\"recovery\", lambda x: x.quantile(.1)),\n                                      theoretical_mean=(\"theoretical\", \"mean\"), high_loss=(\"high_loss\", \"sum\"))\n\n\ndef opportunity(df: pd.DataFrame, constraints: Constraints) -> pd.DataFrame:\n    \"\"\"Best theoretical recovery per (diameter, thickness) vs what was used.\"\"\"\n    rows = []\n    for (d, t), grp in df.groupby([\"diameter\", \"thickness\"]):\n        r0 = grp.iloc[0]\n        best = optimise(Order(d, t, bridge=r0.bridge, edge=r0.edge), constraints, top=1)\n        if best.empty:\n            continue\n        b = best.iloc[0]\n        used = np.average(grp.theoretical, weights=grp.input_kg)\n        rows.append(dict(diameter=d, thickness=t, batches=len(grp), used_theoretical=used,\n                         best_theoretical=b.recovery, gain_pp=(b.recovery - used) * 100,\n                         best_width=b.coil_width, best_lanes=b.lanes, best_angle=b.angle,\n                         input_t=grp.input_kg.sum() / 1000))\n    out = pd.DataFrame(rows)\n    if not out.empty:\n        out[\"material_saved_t\"] = out.input_t * (1 - out.used_theoretical / out.best_theoretical)\n    return out\n\n\ndef synthetic_batches(n: int = 600, seed: int = 0) -> pd.DataFrame:\n    \"\"\"Fake production log for demos and tests. Operators pick configurations\n    by habit (fixed angle, sometimes too-wide coils); actual recovery is the\n    theoretical value minus process losses, with occasional bad batches.\"\"\"\n    rng = np.random.default_rng(seed)\n    widths = [1000, 1100, 1250, 1350, 1500]\n    rows = []\n    for i in range(n):\n        d = float(rng.choice([180, 220, 260, 300, 355, 405]))\n        t = float(rng.choice([0.8, 1.0, 1.2, 1.5]))\n        bridge, edge = 3.0, 5.0\n        angle = float(rng.choice([60.0, 90.0], p=[0.6, 0.4]))\n        W = float(rng.choice(widths))\n        lanes = 1\n        while layout(d, bridge, edge, lanes + 1, angle, W).feasible and lanes < 6:\n            lanes += 1\n        L = layout(d, bridge, edge, lanes, angle, W)\n        input_kg = float(rng.uniform(2000, 6000))\n        loss = rng.normal(0.02, 0.006) + (rng.random() < 0.04) * rng.uniform(0.04, 0.12)\n        rows.append(dict(batch_id=f\"B{i:05d}\", date=pd.Timestamp(\"2025-01-01\") + pd.Timedelta(days=int(i * 365 / n)),\n                         diameter=d, thickness=t, coil_width=W, lanes=lanes, angle=angle,\n                         bridge=bridge, edge=edge, input_kg=round(input_kg, 1),\n                         output_kg=round(input_kg * max(L.recovery - loss, 0.05), 1)))\n    return pd.DataFrame(rows)\n", "src/blanking/geometry.py": "\"\"\"Geometry of a staggered circle-blanking layout.\n\nCircles of diameter ``D`` are punched in ``k`` lanes running along the coil.\nNeighbouring blanks must be at least ``s = D + bridge`` apart (centre to\ncentre), and every blank must stay ``edge`` mm inside the strip edge.\n\nThe *blanking angle* \u03b8 is the angle between the coil's rolling direction and\nthe line joining the centres of neighbouring blanks in adjacent lanes:\n\n    lane spacing (across width) = s\u00b7sin \u03b8\n    pitch (along coil)          = max(s, 2\u00b7s\u00b7cos \u03b8)\n    lane j is shifted by        j\u00b7s\u00b7cos \u03b8  (mod pitch)\n\n\u03b8 = 60\u00b0 is hexagonal packing (\u03b8 = 30\u00b0 is the same packing rotated, with a\nnarrower strip and longer pitch); \u03b8 = 90\u00b0 is a square grid. Below 30\u00b0 blanks two\nlanes apart would overlap, so \u03b8 is limited to [30\u00b0, 90\u00b0]. For \u03b8 \u2265 60\u00b0 the\npitch is the minimum ``s``; smaller angles trade a longer pitch for a narrower\nstrip, which is what lets an extra lane fit onto a given coil width.\n\"\"\"\nfrom __future__ import annotations\n\nimport math\nfrom dataclasses import dataclass\n\nimport numpy as np\n\nAL_DENSITY_KG_MM3 = 2.70e-6  # aluminium, 2.70 g/cm^3\n\n\n@dataclass(frozen=True)\nclass Layout:\n    diameter: float\n    bridge: float\n    edge: float\n    lanes: int\n    angle_deg: float\n    coil_width: float\n\n    @property\n    def spacing(self) -> float:\n        return self.diameter + self.bridge\n\n    @property\n    def _theta(self):\n        return math.radians(self.angle_deg)\n\n    @property\n    def lane_spacing(self) -> float:\n        return self.spacing * math.sin(self._theta) if self.lanes > 1 else 0.0\n\n    @property\n    def pitch(self) -> float:\n        if self.lanes == 1:\n            return self.spacing\n        return max(self.spacing, 2 * self.spacing * math.cos(self._theta))\n\n    @property\n    def width_used(self) -> float:\n        \"\"\"Strip width needed, including both edge allowances.\"\"\"\n        return 2 * self.edge + self.diameter + (self.lanes - 1) * self.lane_spacing\n\n    @property\n    def side_scrap(self) -> float:\n        return self.coil_width - self.width_used\n\n    @property\n    def feasible(self) -> bool:\n        ok_angle = self.lanes == 1 or 30.0 - 1e-9 <= self.angle_deg <= 90.0 + 1e-9\n        return ok_angle and self.width_used <= self.coil_width + 1e-9\n\n    @property\n    def blank_area(self) -> float:\n        return math.pi * self.diameter ** 2 / 4\n\n    @property\n    def recovery(self) -> float:\n        \"\"\"Steady-state material recovery: blank area / strip area consumed.\"\"\"\n        return self.lanes * self.blank_area / (self.coil_width * self.pitch)\n\n    @property\n    def blanks_per_metre(self) -> float:\n        return self.lanes * 1000.0 / self.pitch\n\n    def lane_offsets(self) -> np.ndarray:\n        if self.lanes == 1:\n            return np.zeros(1)\n        shift = self.spacing * math.cos(self._theta)\n        return np.mod(np.arange(self.lanes) * shift, self.pitch)\n\n    def centres(self, length: float) -> np.ndarray:\n        \"\"\"All blank centres (x along coil, y across) on a strip of ``length`` mm.\"\"\"\n        r = self.diameter / 2\n        y0 = (self.coil_width - self.width_used) / 2 + self.edge + r  # centre the pattern\n        pts = []\n        for j, off in enumerate(self.lane_offsets()):\n            xs = np.arange(r + off, length - r + 1e-9, self.pitch)\n            pts.append(np.column_stack([xs, np.full_like(xs, y0 + j * self.lane_spacing)]))\n        return np.vstack(pts) if pts else np.zeros((0, 2))\n\n    def blanks_from_length(self, length: float, head_tail: float = 0.0) -> int:\n        usable = length - head_tail\n        if usable < self.diameter:\n            return 0\n        n = np.floor((usable - self.diameter - self.lane_offsets()) / self.pitch) + 1\n        return int(np.clip(n, 0, None).sum())\n\n    def coil_length(self, coil_kg: float, thickness: float) -> float:\n        \"\"\"Length (mm) of a coil of given mass, width and thickness.\"\"\"\n        return coil_kg / (AL_DENSITY_KG_MM3 * self.coil_width * thickness)\n\n\ndef layout(diameter, bridge, edge, lanes, angle_deg, coil_width) -> Layout:\n    return Layout(float(diameter), float(bridge), float(edge), int(lanes), float(angle_deg), float(coil_width))\n\n\ndef best_angle(diameter, bridge, edge, lanes, coil_width, min_angle=30.0, max_angle=90.0):\n    \"\"\"Closed-form optimum angle for fixed lanes and width (used to check the\n    grid search): the smallest pitch whose layout still fits the width.\"\"\"\n    s = diameter + bridge\n    if lanes == 1:\n        return 90.0 if diameter + 2 * edge <= coil_width else None\n    room = (coil_width - 2 * edge - diameter) / ((lanes - 1) * s)\n    if room <= 0:\n        return None\n    theta_fit = 90.0 if room >= 1 else math.degrees(math.asin(room))\n    hi = min(theta_fit, max_angle)\n    if hi < max(30.0, min_angle):\n        return None\n    return min(max(60.0, min_angle), hi) if hi >= 60.0 else hi\n", "src/blanking/optimizer.py": "\"\"\"Enumerate coil width \u00d7 lanes \u00d7 angle configurations under machine and\norder constraints and rank them by material recovery.\"\"\"\nfrom __future__ import annotations\n\nimport math\nfrom dataclasses import dataclass, field\n\nimport numpy as np\nimport pandas as pd\n\nimport math as _m\n\nfrom .geometry import AL_DENSITY_KG_MM3, best_angle, layout\n\n\n@dataclass\nclass Constraints:\n    coil_widths: list[float]                      # widths available in stock (mm)\n    min_strip_width: float = 0.0                  # line / straightener limits (mm)\n    max_strip_width: float = 2000.0\n    max_lanes: int = 6                            # die / press limit\n    angle_min: float = 30.0\n    angle_max: float = 90.0\n    angle_step: float = 0.5\n    coil_stock_kg: dict | None = None             # width -> kg available (optional)\n    head_tail_mm: float = 0.0                     # scrap at each coil's start+end\n    coil_kg: float = 3000.0                       # typical coil mass\n\n\n@dataclass\nclass Order:\n    diameter: float\n    thickness: float\n    quantity: int = 0\n    bridge: float = 3.0\n    edge: float = 5.0\n\n\ndef enumerate_configs(order: Order, c: Constraints) -> pd.DataFrame:\n    angles = np.round(np.arange(c.angle_min, c.angle_max + 1e-9, c.angle_step), 4)\n    rows = []\n    for W in c.coil_widths:\n        for k in range(1, c.max_lanes + 1):\n            cand = [90.0] if k == 1 else list(angles)\n            if k > 1:\n                # the exact optimum often lies between grid points (the angle at\n                # which the pattern exactly fills the coil); add it, rounded\n                # down to 0.01 deg so it still fits\n                exact = best_angle(order.diameter, order.bridge, order.edge, k, W, c.angle_min, c.angle_max)\n                if exact is not None:\n                    exact = _m.floor(exact * 100) / 100\n                    if exact >= c.angle_min and exact not in cand:\n                        cand.append(exact)\n            for a in cand:\n                L = layout(order.diameter, order.bridge, order.edge, k, a, W)\n                reason = None\n                if not L.feasible:\n                    reason = \"pattern wider than coil\"\n                elif not (c.min_strip_width <= W <= c.max_strip_width):\n                    reason = \"coil width outside line limits\"\n                rows.append(dict(coil_width=W, lanes=k, angle=float(a), pitch=L.pitch,\n                                 width_used=L.width_used, side_scrap=L.side_scrap,\n                                 recovery=L.recovery, blanks_per_m=L.blanks_per_metre,\n                                 feasible=reason is None, reason=reason))\n    return pd.DataFrame(rows)\n\n\ndef plan_order(row, order: Order, c: Constraints) -> dict:\n    \"\"\"Coils, metres and kg of input needed to produce ``order.quantity`` blanks.\"\"\"\n    L = layout(order.diameter, order.bridge, order.edge, row.lanes, row.angle, row.coil_width)\n    coil_len = L.coil_length(c.coil_kg, order.thickness)\n    per_coil = L.blanks_from_length(coil_len, c.head_tail_mm)\n    if per_coil == 0:\n        return dict(blanks_per_coil=0, coils_needed=math.inf, input_kg=math.inf, scrap_kg=math.inf)\n    coils = math.ceil(order.quantity / per_coil) if order.quantity else 0\n    input_kg = coils * c.coil_kg\n    blank_kg = order.quantity * L.blank_area * order.thickness * AL_DENSITY_KG_MM3\n    return dict(blanks_per_coil=per_coil, coils_needed=coils, input_kg=input_kg,\n                scrap_kg=input_kg - blank_kg,\n                effective_recovery=blank_kg / input_kg if input_kg else L.recovery)\n\n\ndef optimise(order: Order, c: Constraints, top: int = 10, dedupe_angles: bool = True) -> pd.DataFrame:\n    \"\"\"Rank feasible configurations. Among angles giving the same recovery for\n    one width and lane count, keep the one closest to 60\u00b0 (most robust).\"\"\"\n    df = enumerate_configs(order, c)\n    ok = df[df.feasible].copy()\n    if ok.empty:\n        return ok\n    ok[\"recovery_r\"] = ok.recovery.round(6)\n    if dedupe_angles:\n        ok[\"dist60\"] = (ok.angle - 60).abs()\n        ok = ok.sort_values([\"recovery_r\", \"dist60\"], ascending=[False, True])\n        ok = ok.drop_duplicates([\"coil_width\", \"lanes\", \"recovery_r\"])\n    ok = ok.sort_values(\"recovery\", ascending=False)\n    if order.quantity:\n        plans = pd.DataFrame([plan_order(r, order, c) for r in ok.itertuples()], index=ok.index)\n        ok = pd.concat([ok, plans], axis=1)\n        if c.coil_stock_kg:\n            stock = ok.coil_width.map(c.coil_stock_kg).fillna(0)\n            ok[\"enough_stock\"] = stock >= ok.input_kg\n            ok = ok.sort_values([\"enough_stock\", \"recovery\"], ascending=[False, False])\n    return ok.drop(columns=[\"recovery_r\", \"dist60\", \"feasible\", \"reason\"], errors=\"ignore\").head(top).reset_index(drop=True)\n", "src/blanking/plot.py": "import matplotlib.pyplot as plt\nfrom matplotlib.patches import Circle, Rectangle\n\nfrom .geometry import Layout\n\n\ndef draw_layout(L: Layout, length: float | None = None, ax=None):\n    length = length or 4 * L.pitch + L.diameter\n    ax = ax or plt.subplots(figsize=(9, 9 * L.coil_width / length if length else 3))[1]\n    ax.add_patch(Rectangle((0, 0), length, L.coil_width, fc=\"#d9dde1\", ec=\"#5b6670\"))\n    off = (L.coil_width - L.width_used) / 2\n    ax.axhspan(off, off + L.edge, color=\"#f4c7a1\", alpha=.6, lw=0)\n    ax.axhspan(L.coil_width - off - L.edge, L.coil_width - off, color=\"#f4c7a1\", alpha=.6, lw=0)\n    for x, y in L.centres(length):\n        ax.add_patch(Circle((x, y), L.diameter / 2, fc=\"#2f6f8f\", ec=\"white\", lw=.8))\n    ax.set_xlim(0, length); ax.set_ylim(0, L.coil_width); ax.set_aspect(\"equal\")\n    ax.set_xlabel(\"along coil (mm)\"); ax.set_ylabel(\"across coil (mm)\")\n    ax.set_title(f\"{L.lanes} lane(s) at {L.angle_deg:g}\u00b0, pitch {L.pitch:.1f} mm, \"\n                 f\"recovery {L.recovery:.1%}\")\n    return ax\n"},
    }, document.getElementById("root"));
  </script>
